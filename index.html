<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테트리스 - 바이브 코딩 실습</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Consolas', monospace;
      color: #e2e8f0;
    }
    .game-container { display: flex; gap: 24px; align-items: flex-start; }
    #gameCanvas { border: 2px solid #334155; background: #0f172a; display: block; }
    .side-panel { width: 150px; display: flex; flex-direction: column; gap: 16px; }
    .panel-box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
    .panel-box h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #64748b; margin-bottom: 8px; }
    .panel-box .value { font-size: 28px; font-weight: bold; color: #e2e8f0; }
    #overlay {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75); justify-content: center; align-items: center;
      flex-direction: column; gap: 16px; font-size: 24px; color: #f1f5f9;
    }
    #overlay.show { display: flex; }
    #restartBtn {
      background: #3b82f6; color: white; border: none; padding: 10px 28px;
      font-size: 16px; border-radius: 6px; cursor: pointer; font-family: 'Consolas', monospace;
    }
    #restartBtn:hover { background: #2563eb; }
    .canvas-wrapper { position: relative; }
    .controls { font-size: 12px; color: #475569; line-height: 1.8; }
  </style>
</head>
<body>

<div class="game-container">
  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="300" height="600"></canvas>
    <div id="overlay">
      <div>GAME OVER</div>
      <button id="restartBtn">다시 시작</button>
    </div>
  </div>
  <div class="side-panel">
    <div class="panel-box"><h3>점수</h3><div class="value" id="scoreDisplay">0</div></div>
    <div class="panel-box"><h3>레벨</h3><div class="value" id="levelDisplay">1</div></div>
    <div class="panel-box"><h3>라인</h3><div class="value" id="linesDisplay">0</div></div>
    <div class="panel-box controls"><h3>조작법</h3>← → 이동<br>↑ 회전<br>↓ 빠르게<br></div>
  </div>
</div>

<script>
// ============================================================
//  ■ 상수 정의
// ============================================================
const COLS       = 10;
const ROWS       = 20;
const BLOCK_SIZE = 30;

const SHAPES = {
  I: [[1, 1, 1, 1]],
  O: [[1, 1],[1, 1]],
  T: [[0, 1, 0],[1, 1, 1]],
  S: [[0, 1, 1],[1, 1, 0]],
  Z: [[1, 1, 0],[0, 1, 1]],
  L: [[1, 0],[1, 0],[1, 1]],
  J: [[0, 1],[0, 1],[1, 1]],
};

const COLORS = {
  I: '#00f0f0', O: '#f0f000', T: '#a000f0',
  S: '#00f000', Z: '#f00000', L: '#f0a000', J: '#0000f0',
};

const PIECE_TYPES = Object.keys(SHAPES);

// ============================================================
//  ■ 캔버스 초기화
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

// ============================================================
//  ■ 게임 상태 변수
// ============================================================
let board        = [];
let currentPiece = null;
let score        = 0;
let level        = 1;
let linesCleared = 0;
let gameOver     = false;
let lastTime     = 0;
let dropInterval = 1000;

// ============================================================
//  ■ 단일 블록 그리기 헬퍼
// ============================================================
function drawBlock(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, 4);
}

// ============================================================
//  1. initBoard(): ROWS×COLS 크기의 null 2D 배열로 board 초기화
// ============================================================
function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    board.push(new Array(COLS).fill(null)); // 각 행을 null로 초기화
  }
}

// ============================================================
//  2. createPiece(): 랜덤 블록 생성, 보드 중앙 상단에 배치
// ============================================================
function createPiece() {
  const type  = PIECE_TYPES[Math.floor(Math.random() * PIECE_TYPES.length)];
  const shape = SHAPES[type];
  const x     = Math.floor((COLS - shape[0].length) / 2); // 보드 가로 중앙 정렬

  currentPiece = { shape, color: COLORS[type], x, y: 0 };
}

// ============================================================
//  3. isCollision(): (dx,dy) 이동 시 벽·바닥·기존 블록 충돌 여부 반환
// ============================================================
function isCollision(piece, dx, dy) {
  for (let r = 0; r < piece.shape.length; r++) {
    for (let c = 0; c < piece.shape[r].length; c++) {
      if (!piece.shape[r][c]) continue; // 빈 칸 건너뜀

      const nx = piece.x + c + dx; // 이동 후 보드 x 좌표
      const ny = piece.y + r + dy; // 이동 후 보드 y 좌표

      if (nx < 0 || nx >= COLS) return true;               // ① 좌우 벽 충돌
      if (ny >= ROWS)           return true;               // ② 바닥 충돌
      if (ny >= 0 && board[ny][nx] !== null) return true;  // ③ 기존 블록 충돌
    }
  }
  return false;
}

// ============================================================
//  4. rotate(): shape을 90도 시계 방향으로 회전한 새 배열 반환
// ============================================================
function rotate(shape) {
  const rows = shape.length;
  const cols = shape[0].length;

  // 회전 후 크기는 cols × rows (가로·세로 뒤바뀜)
  const rotated = Array.from({ length: cols }, () => new Array(rows).fill(0));

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      rotated[c][rows - 1 - r] = shape[r][c]; // 90도 시계 방향 회전 공식
    }
  }
  return rotated;
}

// ============================================================
//  5. placePiece(): currentPiece를 board에 고정
// ============================================================
function placePiece() {
  for (let r = 0; r < currentPiece.shape.length; r++) {
    for (let c = 0; c < currentPiece.shape[r].length; c++) {
      if (!currentPiece.shape[r][c]) continue; // 빈 칸 건너뜀

      const bx = currentPiece.x + c; // 보드 기준 x 좌표
      const by = currentPiece.y + r; // 보드 기준 y 좌표

      if (by >= 0) {
        board[by][bx] = currentPiece.color; // 해당 칸에 색상 고정
      }
    }
  }
}

// ============================================================
//  6. clearLines(): 가득 찬 행 제거, 점수·레벨·속도 갱신
// ============================================================
function clearLines() {
  const points = [0, 100, 300, 500, 800]; // 동시 제거 줄 수별 기본 점수
  let count = 0; // 이번에 제거된 줄 수

  for (let r = ROWS - 1; r >= 0; r--) {
    // 행의 모든 칸이 null이 아닌지 확인 (= 가득 찬 행)
    const isFull = board[r].every(cell => cell !== null);

    if (isFull) {
      board.splice(r, 1);                        // 가득 찬 행 제거
      board.unshift(new Array(COLS).fill(null)); // 맨 위에 빈 행 추가
      r++;    // splice로 인덱스가 당겨졌으므로 동일 행을 재검사
      count++;
    }
  }

  if (count > 0) {
    score        += points[count] * level;              // 줄 수·레벨 가중 점수
    linesCleared += count;                              // 누적 제거 줄 수
    level         = Math.floor(linesCleared / 10) + 1; // 10줄마다 레벨 업
    dropInterval  = Math.max(100, 1000 - (level - 1) * 100); // 최소 100ms까지 가속
  }
}

// ============================================================
//  7. draw(): 매 프레임 화면 전체 렌더링
// ============================================================
function draw() {
  // ① 배경 지우기
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 격자 선 (옅게)
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 0.5;
  for (let c = 0; c < COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c * BLOCK_SIZE, 0); ctx.lineTo(c * BLOCK_SIZE, canvas.height); ctx.stroke();
  }
  for (let r = 0; r < ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r * BLOCK_SIZE); ctx.lineTo(canvas.width, r * BLOCK_SIZE); ctx.stroke();
  }

  // ② board에 고정된 블록 그리기
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c]) drawBlock(c, r, board[r][c]); // null이 아닌 칸만 그리기
    }
  }

  // ③ 현재 낙하 중인 블록 그리기
  if (currentPiece) {
    for (let r = 0; r < currentPiece.shape.length; r++) {
      for (let c = 0; c < currentPiece.shape[r].length; c++) {
        if (currentPiece.shape[r][c]) { // 블록이 존재하는 칸만 그리기
          drawBlock(currentPiece.x + c, currentPiece.y + r, currentPiece.color);
        }
      }
    }
  }
}

// ============================================================
//  8. keydown 핸들러: 방향키로 이동·회전·빠른 하강
// ============================================================
document.addEventListener('keydown', (e) => {
  if (gameOver) return;
  if (!currentPiece) return;

  switch (e.key) {
    case 'ArrowLeft':
      // 왼쪽 이동: 충돌 없을 때만 x 감소
      if (!isCollision(currentPiece, -1, 0)) currentPiece.x -= 1;
      break;

    case 'ArrowRight':
      // 오른쪽 이동: 충돌 없을 때만 x 증가
      if (!isCollision(currentPiece, 1, 0)) currentPiece.x += 1;
      break;

    case 'ArrowDown':
      // 빠른 하강: 충돌 없으면 y 증가, 충돌이면 고정 후 새 블록 생성
      if (!isCollision(currentPiece, 0, 1)) {
        currentPiece.y += 1;
      } else {
        placePiece();
        clearLines();
        updateUI();
        createPiece();
        if (isCollision(currentPiece, 0, 0)) { // 새 블록이 즉시 충돌 → 게임 오버
          gameOver = true;
          showGameOver();
        }
      }
      break;

    case 'ArrowUp':
      // 회전: 충돌 없을 때만 회전된 shape 적용, 충돌이면 원복
      const rotatedShape = rotate(currentPiece.shape);
      const prevShape    = currentPiece.shape;   // 원래 shape 백업
      currentPiece.shape = rotatedShape;
      if (isCollision(currentPiece, 0, 0)) {
        currentPiece.shape = prevShape;          // 충돌이면 회전 취소
      }
      break;
  }

  draw(); // 입력 처리 후 즉시 화면 갱신
});

// ============================================================
//  9. gameLoop(): dropInterval마다 자동 하강, 게임 오버 감지
// ============================================================
function gameLoop(timestamp) {
  if (gameOver) return; // 게임 오버 상태면 루프 중단

  const deltaTime = timestamp - lastTime; // 마지막 하강 이후 경과 시간(ms)

  if (deltaTime > dropInterval) {
    if (!isCollision(currentPiece, 0, 1)) {
      currentPiece.y += 1; // 충돌 없으면 한 칸 자동 하강
    } else {
      placePiece();  // 바닥·블록에 닿으면 고정
      clearLines();  // 완성 줄 제거 및 점수·레벨 갱신
      updateUI();    // 사이드 패널 점수판 업데이트
      createPiece(); // 다음 블록 생성

      if (isCollision(currentPiece, 0, 0)) { // 새 블록이 즉시 충돌 → 게임 오버
        gameOver = true;
        showGameOver();
        return; // 루프 즉시 종료
      }
    }
    lastTime = timestamp; // 기준 시간 갱신
  }

  draw();                          // 매 프레임 화면 갱신
  requestAnimationFrame(gameLoop); // 다음 프레임 예약
}

// ============================================================
//  ■ UI 업데이트 헬퍼
// ============================================================
function updateUI() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('levelDisplay').textContent = level;
  document.getElementById('linesDisplay').textContent = linesCleared;
}

// ============================================================
//  ■ 게임 시작 / 재시작
// ============================================================
function startGame() {
  initBoard();
  score        = 0;
  level        = 1;
  linesCleared = 0;
  gameOver     = false;
  dropInterval = 1000;
  lastTime     = 0;

  createPiece();
  updateUI();

  document.getElementById('overlay').classList.remove('show');
  requestAnimationFrame(gameLoop);
}

function showGameOver() {
  document.getElementById('overlay').classList.add('show');
}

document.getElementById('restartBtn').addEventListener('click', startGame);

// 게임 시작!
startGame();
</script>
</body>
</html>
