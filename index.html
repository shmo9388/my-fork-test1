<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테트리스</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #060a10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Share Tech Mono', monospace;
      color: #c8d8e8;
      overflow: hidden;
    }

    /* 배경 격자 효과 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,200,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .game-wrapper {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      position: relative;
    }

    /* ===== 메인 캔버스 ===== */
    .canvas-wrapper {
      position: relative;
      filter: drop-shadow(0 0 20px rgba(0,200,255,0.15));
    }

    #gameCanvas {
      display: block;
      border: 1px solid rgba(0,200,255,0.25);
      background: #070d14;
    }

    /* 캔버스 모서리 장식 */
    .canvas-wrapper::before,
    .canvas-wrapper::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      border-color: rgba(0,200,255,0.6);
      border-style: solid;
      z-index: 2;
    }
    .canvas-wrapper::before { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
    .canvas-wrapper::after  { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

    /* ===== 사이드 패널 ===== */
    .side-panel {
      width: 148px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-box {
      background: rgba(10,20,35,0.9);
      border: 1px solid rgba(0,200,255,0.15);
      border-radius: 4px;
      padding: 12px 14px;
      position: relative;
    }

    .panel-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,200,255,0.4), transparent);
    }

    .panel-box h3 {
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      letter-spacing: 3px;
      color: rgba(0,200,255,0.5);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .panel-box .value {
      font-family: 'Orbitron', monospace;
      font-size: 26px;
      font-weight: 700;
      color: #e8f4ff;
      line-height: 1;
      text-shadow: 0 0 20px rgba(0,200,255,0.4);
    }

    /* ===== NEXT 미리보기 캔버스 ===== */
    #nextCanvas {
      display: block;
      margin: 6px auto 0;
    }

    /* ===== 조작법 ===== */
    .controls {
      font-size: 11px;
      color: rgba(150,180,210,0.6);
      line-height: 2;
    }
    .controls .key {
      display: inline-block;
      background: rgba(0,200,255,0.08);
      border: 1px solid rgba(0,200,255,0.2);
      border-radius: 3px;
      padding: 0 5px;
      font-size: 10px;
      color: rgba(0,200,255,0.7);
      margin-right: 4px;
    }

    /* ===== 오버레이 ===== */
    #overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(4,10,18,0.88);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 20px;
      backdrop-filter: blur(4px);
      z-index: 10;
    }
    #overlay.show { display: flex; }

    .overlay-title {
      font-family: 'Orbitron', monospace;
      font-size: 28px;
      font-weight: 900;
      color: #e8f4ff;
      letter-spacing: 6px;
      text-shadow: 0 0 30px rgba(0,200,255,0.6);
    }

    .overlay-sub {
      font-size: 13px;
      color: rgba(0,200,255,0.6);
      letter-spacing: 2px;
    }

    #restartBtn {
      background: transparent;
      color: rgba(0,200,255,0.9);
      border: 1px solid rgba(0,200,255,0.4);
      padding: 10px 32px;
      font-size: 13px;
      letter-spacing: 3px;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Orbitron', monospace;
      transition: all 0.2s;
      text-transform: uppercase;
    }
    #restartBtn:hover {
      background: rgba(0,200,255,0.1);
      border-color: rgba(0,200,255,0.8);
      box-shadow: 0 0 20px rgba(0,200,255,0.2);
    }

    /* ===== PAUSE 오버레이 ===== */
    #pauseOverlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(4,10,18,0.75);
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(2px);
      z-index: 9;
    }
    #pauseOverlay.show { display: flex; }
    .pause-text {
      font-family: 'Orbitron', monospace;
      font-size: 22px;
      font-weight: 700;
      color: rgba(0,200,255,0.8);
      letter-spacing: 8px;
      text-shadow: 0 0 20px rgba(0,200,255,0.5);
      animation: pauseBlink 1.2s ease-in-out infinite;
    }
    @keyframes pauseBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ===== 라인 클리어 플래시 ===== */
    #flashOverlay {
      position: absolute;
      inset: 0;
      background: rgba(0,200,255,0.12);
      pointer-events: none;
      opacity: 0;
      z-index: 5;
      transition: opacity 0.08s;
    }
    #flashOverlay.flash { opacity: 1; }

    /* 레벨업 뱃지 */
    #levelUpBadge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-family: 'Orbitron', monospace;
      font-size: 18px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(0,200,255,1);
      background: rgba(0,200,255,0.15);
      border: 1px solid rgba(0,200,255,0.6);
      padding: 10px 24px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      transition: transform 0.2s cubic-bezier(0.175,0.885,0.32,1.275), opacity 0.2s;
    }
    #levelUpBadge.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="game-wrapper">

  <!-- 왼쪽 패널 -->
  <div class="side-panel">
    <div class="panel-box">
      <h3>Score</h3>
      <div class="value" id="scoreDisplay">0</div>
    </div>
    <div class="panel-box">
      <h3>Level</h3>
      <div class="value" id="levelDisplay">1</div>
    </div>
    <div class="panel-box">
      <h3>Lines</h3>
      <div class="value" id="linesDisplay">0</div>
    </div>
  </div>

  <!-- 메인 캔버스 -->
  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="300" height="600"></canvas>
    <div id="flashOverlay"></div>
    <div id="levelUpBadge">LEVEL UP</div>
    <div id="pauseOverlay"><div class="pause-text">PAUSE</div></div>
    <div id="overlay">
      <div class="overlay-title">GAME OVER</div>
      <div class="overlay-sub" id="finalScore"></div>
      <button id="restartBtn">RESTART</button>
    </div>
  </div>

  <!-- 오른쪽 패널 -->
  <div class="side-panel">
    <div class="panel-box">
      <h3>Next</h3>
      <canvas id="nextCanvas" width="120" height="80"></canvas>
    </div>
    <div class="panel-box controls">
      <h3>Keys</h3>
      <span class="key">←→</span> 이동<br>
      <span class="key">↑</span> 회전<br>
      <span class="key">↓</span> 내리기<br>
      <span class="key">SPC</span> 즉시낙하<br>
      <span class="key">P</span> 일시정지<br>
    </div>
    <div class="panel-box">
      <h3>Hi-Score</h3>
      <div class="value" id="hiScoreDisplay">0</div>
    </div>
  </div>

</div>

<script>
// ============================================================
//  ■ 상수
// ============================================================
const COLS       = 10;
const ROWS       = 20;
const BLOCK_SIZE = 30;

const SHAPES = {
  I: [[1,1,1,1]],
  O: [[1,1],[1,1]],
  T: [[0,1,0],[1,1,1]],
  S: [[0,1,1],[1,1,0]],
  Z: [[1,1,0],[0,1,1]],
  L: [[1,0],[1,0],[1,1]],
  J: [[0,1],[0,1],[1,1]],
};

const COLORS = {
  I: '#00e5ff', O: '#ffe600', T: '#cc00ff',
  S: '#00ff88', Z: '#ff3040', L: '#ff8800', J: '#4488ff',
};

// 블록별 고스트(잔상) 색
const GHOST_COLORS = {
  I: 'rgba(0,229,255,0.18)', O: 'rgba(255,230,0,0.18)', T: 'rgba(204,0,255,0.18)',
  S: 'rgba(0,255,136,0.18)', Z: 'rgba(255,48,64,0.18)',  L: 'rgba(255,136,0,0.18)',
  J: 'rgba(68,136,255,0.18)',
};

const PIECE_TYPES = Object.keys(SHAPES);

// ============================================================
//  ■ 캔버스
// ============================================================
const canvas     = document.getElementById('gameCanvas');
const ctx        = canvas.getContext('2d');
const nextCanvas = document.getElementById('nextCanvas');
const nctx       = nextCanvas.getContext('2d');

// ============================================================
//  ■ 게임 상태
// ============================================================
let board        = [];
let currentPiece = null;
let nextPiece    = null;   // ★ 다음 블록
let score        = 0;
let hiScore      = 0;
let level        = 1;
let linesCleared = 0;
let gameOver     = false;
let paused       = false;  // ★ 일시정지
let lastTime     = 0;
let dropInterval = 1000;

// ============================================================
//  ■ drawBlock 헬퍼
// ============================================================
function drawBlock(c, x, y, color, ghost = false) {
  if (ghost) {
    c.fillStyle = color;
    c.fillRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
    c.strokeStyle = color.replace('0.18', '0.5');
    c.lineWidth = 1;
    c.strokeRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
    return;
  }
  // 메인 블록
  const grd = c.createLinearGradient(
    x * BLOCK_SIZE, y * BLOCK_SIZE,
    x * BLOCK_SIZE + BLOCK_SIZE, y * BLOCK_SIZE + BLOCK_SIZE
  );
  grd.addColorStop(0, color);
  grd.addColorStop(1, shadeColor(color, -40));
  c.fillStyle = grd;
  c.fillRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);

  // 하이라이트
  c.fillStyle = 'rgba(255,255,255,0.22)';
  c.fillRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, 5);
  c.fillRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, 5, BLOCK_SIZE - 2);

  // 테두리 (밝게)
  c.strokeStyle = 'rgba(255,255,255,0.12)';
  c.lineWidth = 1;
  c.strokeRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
}

// 색상 어둡게/밝게 조정 헬퍼
function shadeColor(hex, amt) {
  let r = parseInt(hex.slice(1,3),16) + amt;
  let g = parseInt(hex.slice(3,5),16) + amt;
  let b = parseInt(hex.slice(5,7),16) + amt;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

// ============================================================
//  ■ initBoard
// ============================================================
function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) board.push(new Array(COLS).fill(null));
}

// ============================================================
//  ■ createPiece: nextPiece → currentPiece, 새 nextPiece 생성
// ============================================================
function createPiece() {
  if (nextPiece) {
    currentPiece = nextPiece;
    // 위치 초기화 (nextCanvas용으로 저장했던 위치 덮어쓰기)
    const shape = currentPiece.shape;
    currentPiece.x = Math.floor((COLS - shape[0].length) / 2);
    currentPiece.y = 0;
  } else {
    // 게임 첫 시작 시
    const type  = PIECE_TYPES[Math.floor(Math.random() * PIECE_TYPES.length)];
    const shape = SHAPES[type];
    currentPiece = { shape, color: COLORS[type], ghostColor: GHOST_COLORS[type],
                     type, x: Math.floor((COLS - shape[0].length) / 2), y: 0 };
  }
  // 다음 블록 생성
  const nType  = PIECE_TYPES[Math.floor(Math.random() * PIECE_TYPES.length)];
  const nShape = SHAPES[nType];
  nextPiece = { shape: nShape, color: COLORS[nType], ghostColor: GHOST_COLORS[nType],
                type: nType, x: 0, y: 0 };

  drawNextPiece();
}

// ============================================================
//  ■ NEXT 미리보기 그리기
// ============================================================
function drawNextPiece() {
  nctx.fillStyle = '#070d14';
  nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

  if (!nextPiece) return;
  const shape = nextPiece.shape;
  const cols  = shape[0].length;
  const rows  = shape.length;
  const bs    = 24; // 미리보기 블록 크기
  const ox    = Math.floor((nextCanvas.width  - cols * bs) / 2);
  const oy    = Math.floor((nextCanvas.height - rows * bs) / 2);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (!shape[r][c]) continue;
      // 간단한 블록 그리기 (nextCanvas 전용)
      const grd = nctx.createLinearGradient(ox + c*bs, oy + r*bs, ox + c*bs + bs, oy + r*bs + bs);
      grd.addColorStop(0, nextPiece.color);
      grd.addColorStop(1, shadeColor(nextPiece.color, -40));
      nctx.fillStyle = grd;
      nctx.fillRect(ox + c*bs + 1, oy + r*bs + 1, bs - 2, bs - 2);
      nctx.fillStyle = 'rgba(255,255,255,0.2)';
      nctx.fillRect(ox + c*bs + 1, oy + r*bs + 1, bs - 2, 4);
    }
  }
}

// ============================================================
//  ■ isCollision
// ============================================================
function isCollision(piece, dx, dy, shape) {
  const s = shape || piece.shape;
  for (let r = 0; r < s.length; r++) {
    for (let c = 0; c < s[r].length; c++) {
      if (!s[r][c]) continue;
      const nx = piece.x + c + dx;
      const ny = piece.y + r + dy;
      if (nx < 0 || nx >= COLS)              return true;
      if (ny >= ROWS)                        return true;
      if (ny >= 0 && board[ny][nx] !== null) return true;
    }
  }
  return false;
}

// ============================================================
//  ■ rotate
// ============================================================
function rotate(shape) {
  const rows = shape.length, cols = shape[0].length;
  const rotated = Array.from({ length: cols }, () => new Array(rows).fill(0));
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      rotated[c][rows - 1 - r] = shape[r][c];
  return rotated;
}

// ============================================================
//  ■ getGhostY: 고스트 블록 y 위치 계산 ★
// ============================================================
function getGhostY() {
  let gy = currentPiece.y;
  while (!isCollision(currentPiece, 0, gy - currentPiece.y + 1)) gy++;
  return gy;
}

// ============================================================
//  ■ hardDrop: 스페이스바 즉시 낙하 ★
// ============================================================
function hardDrop() {
  const ghostY = getGhostY();
  const dropped = ghostY - currentPiece.y; // 떨어진 칸 수
  currentPiece.y = ghostY;
  score += dropped * 2; // 즉시 낙하 보너스 (칸당 2점)
  placePiece();
  clearLines();
  updateUI();
  createPiece();
  if (isCollision(currentPiece, 0, 0)) {
    gameOver = true;
    showGameOver();
  }
}

// ============================================================
//  ■ placePiece
// ============================================================
function placePiece() {
  for (let r = 0; r < currentPiece.shape.length; r++) {
    for (let c = 0; c < currentPiece.shape[r].length; c++) {
      if (!currentPiece.shape[r][c]) continue;
      const bx = currentPiece.x + c;
      const by = currentPiece.y + r;
      if (by >= 0) board[by][bx] = currentPiece.color;
    }
  }
}

// ============================================================
//  ■ clearLines
// ============================================================
function clearLines() {
  const points = [0, 100, 300, 500, 800];
  let count = 0;

  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(cell => cell !== null)) {
      board.splice(r, 1);
      board.unshift(new Array(COLS).fill(null));
      r++;
      count++;
    }
  }

  if (count > 0) {
    score        += points[count] * level;
    linesCleared += count;
    const prevLevel = level;
    level         = Math.floor(linesCleared / 10) + 1;
    dropInterval  = Math.max(100, 1000 - (level - 1) * 100);

    // 라인 클리어 플래시 효과
    flashEffect();

    // 레벨업 시 뱃지 표시
    if (level > prevLevel) showLevelUpBadge();

    // 하이스코어 갱신
    if (score > hiScore) {
      hiScore = score;
      document.getElementById('hiScoreDisplay').textContent = hiScore;
    }
  }
}

// ============================================================
//  ■ 효과 함수들
// ============================================================
function flashEffect() {
  const fl = document.getElementById('flashOverlay');
  fl.classList.add('flash');
  setTimeout(() => fl.classList.remove('flash'), 120);
}

function showLevelUpBadge() {
  const badge = document.getElementById('levelUpBadge');
  badge.textContent = `LEVEL ${level}`;
  badge.classList.add('show');
  setTimeout(() => badge.classList.remove('show'), 1200);
}

// ============================================================
//  ■ draw
// ============================================================
function draw() {
  // 배경
  ctx.fillStyle = '#070d14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 격자선
  ctx.strokeStyle = 'rgba(0,200,255,0.04)';
  ctx.lineWidth = 1;
  for (let c = 1; c < COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c * BLOCK_SIZE, 0); ctx.lineTo(c * BLOCK_SIZE, canvas.height); ctx.stroke();
  }
  for (let r = 1; r < ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r * BLOCK_SIZE); ctx.lineTo(canvas.width, r * BLOCK_SIZE); ctx.stroke();
  }

  // 고정 블록
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (board[r][c]) drawBlock(ctx, c, r, board[r][c]);

  if (currentPiece) {
    // ★ 고스트 블록 그리기
    const ghostY = getGhostY();
    if (ghostY !== currentPiece.y) {
      for (let r = 0; r < currentPiece.shape.length; r++)
        for (let c = 0; c < currentPiece.shape[r].length; c++)
          if (currentPiece.shape[r][c])
            drawBlock(ctx, currentPiece.x + c, ghostY + r, currentPiece.ghostColor, true);
    }

    // 현재 블록
    for (let r = 0; r < currentPiece.shape.length; r++)
      for (let c = 0; c < currentPiece.shape[r].length; c++)
        if (currentPiece.shape[r][c])
          drawBlock(ctx, currentPiece.x + c, currentPiece.y + r, currentPiece.color);
  }
}

// ============================================================
//  ■ 키보드 입력
// ============================================================
document.addEventListener('keydown', (e) => {
  // 스페이스바 스크롤 방지
  if (e.key === ' ') e.preventDefault();

  // 일시정지 토글 (P키) ★
  if (e.key === 'p' || e.key === 'P') {
    if (gameOver) return;
    paused = !paused;
    document.getElementById('pauseOverlay').classList.toggle('show', paused);
    if (!paused) {
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }
    return;
  }

  if (gameOver || paused || !currentPiece) return;

  switch (e.key) {
    case 'ArrowLeft':
      if (!isCollision(currentPiece, -1, 0)) currentPiece.x -= 1;
      break;
    case 'ArrowRight':
      if (!isCollision(currentPiece, 1, 0)) currentPiece.x += 1;
      break;
    case 'ArrowDown':
      if (!isCollision(currentPiece, 0, 1)) {
        currentPiece.y += 1;
        score += 1; // 소프트 드롭 보너스
      } else {
        placePiece(); clearLines(); updateUI(); createPiece();
        if (isCollision(currentPiece, 0, 0)) { gameOver = true; showGameOver(); }
      }
      break;
    case ' ':                     // ★ 스페이스바 즉시 낙하
      hardDrop();
      break;
    case 'ArrowUp': {
      const rotated  = rotate(currentPiece.shape);
      const prev     = currentPiece.shape;
      currentPiece.shape = rotated;
      if (isCollision(currentPiece, 0, 0)) currentPiece.shape = prev;
      break;
    }
  }
  draw();
});

// ============================================================
//  ■ gameLoop
// ============================================================
function gameLoop(timestamp) {
  if (gameOver || paused) return;

  const deltaTime = timestamp - lastTime;

  if (deltaTime > dropInterval) {
    if (!isCollision(currentPiece, 0, 1)) {
      currentPiece.y += 1;
    } else {
      placePiece();
      clearLines();
      updateUI();
      createPiece();
      if (isCollision(currentPiece, 0, 0)) {
        gameOver = true;
        showGameOver();
        return;
      }
    }
    lastTime = timestamp;
  }

  draw();
  requestAnimationFrame(gameLoop);
}

// ============================================================
//  ■ UI
// ============================================================
function updateUI() {
  document.getElementById('scoreDisplay').textContent  = score;
  document.getElementById('levelDisplay').textContent  = level;
  document.getElementById('linesDisplay').textContent  = linesCleared;
  if (score > hiScore) {
    hiScore = score;
    document.getElementById('hiScoreDisplay').textContent = hiScore;
  }
}

function showGameOver() {
  document.getElementById('finalScore').textContent = `SCORE : ${score}`;
  document.getElementById('overlay').classList.add('show');
}

// ============================================================
//  ■ startGame
// ============================================================
function startGame() {
  initBoard();
  score        = 0;
  level        = 1;
  linesCleared = 0;
  gameOver     = false;
  paused       = false;
  dropInterval = 1000;
  lastTime     = 0;
  nextPiece    = null;

  document.getElementById('overlay').classList.remove('show');
  document.getElementById('pauseOverlay').classList.remove('show');

  createPiece();
  updateUI();
  requestAnimationFrame(gameLoop);
}

document.getElementById('restartBtn').addEventListener('click', startGame);

startGame();
</script>
</body>
</html>
